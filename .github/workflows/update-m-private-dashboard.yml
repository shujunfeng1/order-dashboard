name: 更新M级私海客户看板
on:
  schedule:
    # 北京时间16:50主动执行Redash查询并获取新结果
    - cron: '50 8 * * *'
  workflow_dispatch:
concurrency:
  group: update-m-private-dashboard
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行查询并校验最新聚合数据
        env:
          REDASH_API_KEY: ${{ secrets.REDASH_M_PRIVATE_API_KEY }}
        run: python pipeline/run_m_private_pipeline.py
      - name: 提交数据
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/m_private_data.json
          if git diff --staged --quiet; then
            echo "数据未变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新M级私海客户聚合数据"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
