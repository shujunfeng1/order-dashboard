<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M级私海客户看板</title>
<style>
:root{--navy:#183b66;--teal:#2f7d78;--muted:#7b838c;--line:#e5e8eb;--orange:#c7532c}*{box-sizing:border-box}body{margin:0;background:#fff;color:#20252b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:3px}header{background:var(--navy);color:#fff;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;font-weight:500;margin:0 0 9px}.meta{color:#c1cddd;font-size:12px}nav{display:flex;flex-wrap:wrap;border:1px solid #7489a2}nav a,nav span{padding:9px 12px;color:#e0e7f0;text-decoration:none;white-space:nowrap;font-size:12px}nav .active{color:var(--navy);background:#fff;font-weight:600}main{max-width:1440px;margin:auto;padding:28px 32px 50px}.intro{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:16px}.status{color:var(--orange)}.filters{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-block:1px solid var(--line);padding:15px 0}.filter{display:flex;align-items:center;gap:8px}.filter label{color:var(--muted);font-size:12px}select,input,button.control{height:34px;border:1px solid #d9dde1;background:#fff;padding:0 10px;color:#20252b;font-size:12px}select{max-width:190px;min-width:118px}input{width:154px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin:24px 0}.kpi{padding:23px;border-right:1px solid var(--line);background:#fff;text-align:left;min-width:0}.kpi:last-child{border-right:0}.kpi small{display:block;color:var(--muted);font-size:12px;margin-bottom:12px}.kpi strong{display:block;color:var(--navy);font-size:32px;font-weight:500;font-variant-numeric:tabular-nums}.kpi em{display:block;font-size:11px;font-style:normal;color:var(--muted);margin-top:10px}button.kpi{border-top:0;border-bottom:0;border-left:0;cursor:pointer;font-family:inherit}button.kpi:hover,button.kpi.selected{background:#fff6ed}button.kpi strong{color:var(--orange)}.charts{display:grid;grid-template-columns:1fr 1.2fr;border-block:1px solid var(--line);margin-bottom:30px}.panel{padding:20px;min-width:0}.panel+.panel{border-left:1px solid var(--line)}.panel-head{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:12px}h2{font-size:16px;font-weight:500;color:var(--navy);margin:0}.caption{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 20px}.toggle{display:flex}.toggle button{padding:6px 10px;background:#fff;border:1px solid var(--line);font-size:11px;color:var(--muted);cursor:pointer}.toggle button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.bar-row{display:grid;grid-template-columns:105px 1fr 56px;gap:10px;align-items:center;margin:12px 0;min-height:27px}.bar-label{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar-label small{display:block;color:var(--muted);font-size:10px}.track{height:14px;background:#f0f3f5;border-radius:2px;overflow:hidden}.bar{height:100%;background:var(--navy);min-width:0}.rank .bar{background:var(--teal)}.bar-value{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}.empty{padding:45px 10px;text-align:center;color:var(--muted)}.table-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}.table-head span{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto;max-height:520px;border-top:2px solid var(--navy)}table{border-collapse:collapse;width:100%;font-size:12px}th{position:sticky;top:0;background:var(--navy);color:white;text-align:left;font-weight:500}th,td{padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}th:last-child,td:last-child{text-align:right}th button{border:0;background:transparent;color:inherit;padding:0;cursor:pointer}tr:nth-child(even){background:#fafbfc}tr:hover{background:#f0f5f7}tr.zero{background:#fff6ed}td:last-child{font-variant-numeric:tabular-nums}.foot{color:var(--muted);font-size:12px;line-height:1.8;margin-top:14px}
@media(max-width:800px){header{align-items:flex-start;flex-direction:column;padding:18px 16px}main{padding:20px 16px}.charts{grid-template-columns:1fr}.panel+.panel{border-left:0;border-top:1px solid var(--line)}.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.kpi{padding:18px 12px}.kpi strong{font-size:28px}.intro{flex-direction:column;gap:4px}.filter{width:calc(50% - 7px)}.filter select,.filter input{min-width:0;width:100%;max-width:none;flex:1}.filter label{white-space:nowrap}.panel{padding:18px 0}.bar-row{grid-template-columns:94px 1fr 52px}.table-head{align-items:flex-start}.caption{margin-bottom:14px}}
</style>
</head>
<body>
<header><div><h1>M级私海客户看板</h1><div class="meta" id="dataTime">正在读取数据…</div></div><nav aria-label="看板切换"><a href="./">卡单数据看板</a><a href="./customer-login-dashboard.html">登录转化看板</a><span class="active">M级私海客户</span></nav></header>
<main>
<div class="intro"><span>统计范围：在职的电销部负责人、BDM、战区负责人、省区负责人</span><span class="status" id="status" role="status"></span></div>
<section class="filters" aria-label="人员筛选">
<div class="filter"><label for="region">大区</label><select id="region"></select></div>
<div class="filter"><label for="province">省区</label><select id="province"></select></div>
<div class="filter"><label for="team">团队</label><select id="team"></select></div>
<div class="filter"><label for="role">岗位</label><select id="role"></select></div>
<div class="filter"><label for="search">花名</label><input id="search" placeholder="搜索花名"></div>
<button id="reset" class="control">重置</button></section>
<section class="kpis" aria-label="核心指标">
<div class="kpi"><small>在职M级人数</small><strong id="people">—</strong><em>当前筛选范围</em></div>
<div class="kpi"><small>普药私海客户数合计</small><strong id="total">—</strong><em>各人员客户数相加</em></div>
<div class="kpi"><small>人均普药私海客户数</small><strong id="average">—</strong><em>包含零客户人员</em></div>
<button class="kpi" id="zero" aria-pressed="false"><small>零客户人数</small><strong id="zeroCount">—</strong><em id="zeroHint">点击仅看零客户人员</em></button>
</section>
<section class="charts">
<article class="panel"><div class="panel-head"><h2>各岗位客户数对比</h2><div class="toggle" id="metric"><button class="active" data-metric="sum" aria-pressed="true">客户数合计</button><button data-metric="avg" aria-pressed="false">人均客户数</button></div></div><p class="caption">岗位人数不同，可切换人均客户数辅助比较。</p><div id="roleBars" aria-label="岗位客户数图表"></div></article>
<article class="panel"><div class="panel-head"><h2>人员客户数排名</h2><select id="ranking" aria-label="排名顺序"><option value="desc">最高15人</option><option value="asc">最低15人</option></select></div><p class="caption">选择岗位后可查看同岗位排名，数量不代表绩效评价。</p><div id="rankBars" class="rank" aria-label="人员客户数排名"></div></article>
</section>
<section><div class="table-head"><h2>人员明细</h2><span id="tableCount"></span></div><div class="table-wrap"><table><thead><tr><th>大区</th><th>省区</th><th>团队</th><th>岗位</th><th>花名</th><th aria-sort="descending" id="sortHeader"><button id="sort">普药私海客户数 ↓</button></th></tr></thead><tbody id="tbody"></tbody></table></div><p class="foot">统计口径：仅包含上述四个岗位的在职人员。客户数合计未经跨人员去重，不代表全公司独立客户总数。浅橙色行表示零客户人员。</p></section>
</main>
<script>
'use strict';
let DATA,zeroOnly=false,metric='sum',sortDir='desc';
const $=id=>document.getElementById(id),fields=['region','province','team','role'];
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function setOptions(id,values){const el=$(id),old=el.value;el.replaceChildren(new Option('全部',''));values.forEach(v=>el.add(new Option(v,v)));if(values.includes(old))el.value=old}
function options(){fields.forEach((f,i)=>{let rows=DATA.rows;fields.slice(0,i).forEach(parent=>{if($(parent).value)rows=rows.filter(r=>r[parent]===$(parent).value)});let values=[...new Set(rows.map(r=>r[f]))];if(f==='role')values=DATA.roles.filter(v=>values.includes(v));else values.sort((a,b)=>a.localeCompare(b,'zh-CN'));setOptions(f,values)})}
function filtered(){return DATA.rows.filter(r=>fields.every(f=>!$(f).value||r[f]===$(f).value)&&(!zeroOnly||r.customers===0)&&r.name.toLowerCase().includes($('search').value.trim().toLowerCase()))}
function drawBars(id,items){const el=$(id);el.replaceChildren();if(!items.length){el.append(node('div','暂无符合条件的数据','empty'));return}const max=Math.max(...items.map(r=>r.value),1);items.forEach(item=>{const row=node('div',undefined,'bar-row'),label=node('div',item.label,'bar-label');label.title=item.label;if(item.sub)label.append(node('small',item.sub));const track=node('div',undefined,'track'),bar=node('div',undefined,'bar');bar.style.width=(item.value/max*100)+'%';track.append(bar);row.append(label,track,node('div',item.text,'bar-value'));row.setAttribute('aria-label',item.label+' '+(item.sub||'')+' '+item.text);row.title=row.getAttribute('aria-label');el.append(row)})}
function render(){const rows=filtered(),total=rows.reduce((s,r)=>s+r.customers,0);$('people').textContent=String(rows.length);$('total').textContent=String(total);$('average').textContent=rows.length?(total/rows.length).toFixed(1):'—';$('zeroCount').textContent=String(rows.filter(r=>r.customers===0).length);$('zero').classList.toggle('selected',zeroOnly);$('zero').setAttribute('aria-pressed',String(zeroOnly));$('zeroHint').textContent=zeroOnly?'再次点击恢复全部人员':'点击仅看零客户人员';
const groups=DATA.roles.map(role=>{const rr=rows.filter(r=>r.role===role),s=rr.reduce((a,r)=>a+r.customers,0);return {label:role,sub:rr.length+'人',value:metric==='avg'?(rr.length?s/rr.length:0):s,text:metric==='avg'?(rr.length?(s/rr.length).toFixed(1):'—'):String(s)}});drawBars('roleBars',rows.length?groups:[]);
const rank=[...rows].sort((a,b)=>($('ranking').value==='asc'?1:-1)*(a.customers-b.customers)||a.name.localeCompare(b.name,'zh-CN')).slice(0,15);drawBars('rankBars',rank.map(r=>({label:r.name,sub:r.role,value:r.customers,text:String(r.customers)})));
const sorted=[...rows].sort((a,b)=>(sortDir==='asc'?1:-1)*(a.customers-b.customers)||a.name.localeCompare(b.name,'zh-CN'));$('tbody').replaceChildren();sorted.forEach(r=>{const tr=node('tr');if(!r.customers)tr.className='zero';['region','province','team','role','name','customers'].forEach(f=>tr.append(node('td',String(r[f]))));$('tbody').append(tr)});if(!rows.length){const tr=node('tr'),td=node('td','暂无符合条件的人员，请调整筛选','empty');td.colSpan=6;tr.append(td);$('tbody').append(tr)}$('tableCount').textContent='当前 '+rows.length+' 人 / 全部 '+DATA.rows.length+' 人';$('sort').textContent='普药私海客户数 '+(sortDir==='desc'?'↓':'↑');$('sortHeader').setAttribute('aria-sort',sortDir==='desc'?'descending':'ascending')}
async function init(){try{const response=await fetch('./m_private_data.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);DATA=await response.json();if(DATA.schema_version!==1||!Array.isArray(DATA.rows)||!DATA.rows.length)throw Error('Invalid data');$('dataTime').textContent='数据时间：'+new Date(DATA.data_time).toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'})+'（北京时间）';const age=Date.now()-Date.parse(DATA.data_time);$('status').textContent=age>48*3600000?'数据已超过48小时，请联系运营检查更新':'每日16:50计划更新 · 以实际数据时间为准';options();render();
fields.forEach(f=>$(f).addEventListener('change',()=>{options();render()}));$('search').addEventListener('input',render);$('ranking').addEventListener('change',render);$('zero').addEventListener('click',()=>{zeroOnly=!zeroOnly;render()});$('sort').addEventListener('click',()=>{sortDir=sortDir==='desc'?'asc':'desc';render()});$('metric').addEventListener('click',e=>{if(!e.target.dataset.metric)return;metric=e.target.dataset.metric;document.querySelectorAll('#metric button').forEach(b=>{b.classList.toggle('active',b.dataset.metric===metric);b.setAttribute('aria-pressed',String(b.dataset.metric===metric))});render()});$('reset').addEventListener('click',()=>{fields.forEach(f=>$(f).value='');$('search').value='';zeroOnly=false;sortDir='desc';options();render()});
}catch(e){$('dataTime').textContent='数据加载失败';$('status').textContent='请稍后刷新或联系运营';$('tbody').innerHTML='<tr><td colspan="6" class="empty">暂时无法获取数据</td></tr>';console.error('M级看板加载失败',e.message)}}
init();
</script></body></html>
